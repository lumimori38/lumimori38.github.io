<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEV LOG — 루미 오락실🎮 (lumimori38)</title>
<meta name="description" content="루미 오락실의 제작 비하인드, 아이디어 메모, 개발 기록, 업데이트 로그">
<meta property="og:type" content="website">
<meta property="og:site_name" content="루미 오락실">
<meta property="og:title" content="DEV LOG — 루미 오락실🎮 (lumimori38)">
<meta property="og:description" content="B급 테스트·게임을 만드는 사람의 기록">
<meta property="og:image" content="https://lumimori38.github.io/og-hub.png">
<meta property="og:url" content="https://lumimori38.github.io/log.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#ffd23f">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/galmuri@2.40.3/dist/galmuri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="/style.css">
<style>
  .topbar{display:flex;justify-content:space-between;align-items:center;background:var(--shell);border-radius:16px;padding:10px 12px;box-shadow:inset 0 -5px 0 var(--shell-dark)}
  .back{font-family:var(--pixel);font-size:12.5px;background:#fff6cf;padding:8px 11px;border-radius:9px;box-shadow:inset 0 -2px 0 var(--shell-dark)}
  .lhero{background:var(--screen);border-radius:14px;margin-top:12px;padding:18px;position:relative;overflow:hidden;box-shadow:inset 0 0 0 4px #2d2650}
  .lhero::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px)}
  .lhero h1{font-family:var(--pixel);color:#fff;font-size:30px;text-shadow:3px 3px 0 #c98f00}
  .lhero p{color:#cfc8ea;font-size:13.5px;margin-top:4px;line-height:1.6;word-break:keep-all}
  .lhero .hello{margin-bottom:6px}
  .legend{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:12px;position:relative;z-index:1}
  .legend span{font-size:12px;color:#cfc8ea;display:flex;align-items:center;gap:6px;white-space:nowrap}
  @media (max-width:400px){.legend{grid-template-columns:1fr}}
  .legend .ltag{font-size:10px}
  .timeline{position:relative;margin-top:6px;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:3px;background:repeating-linear-gradient(180deg,rgba(33,26,58,.18) 0 6px,transparent 6px 10px)}
  .month{font-family:var(--pixel);font-size:12px;color:var(--ink-soft);margin:18px 0 8px -18px;padding-left:0}
  .entry{position:relative;background:#fff;border-radius:14px;padding:13px 14px 12px;margin-bottom:10px;box-shadow:0 0 0 1.5px var(--line)}
  .entry::before{content:"";position:absolute;left:-18px;top:16px;width:11px;height:11px;background:var(--t);box-shadow:0 0 0 3px var(--bg)}
  .entry.hl{box-shadow:0 0 0 3px var(--yellow), 0 8px 18px rgba(33,26,58,.1)}
  .ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .etitle{font-size:16px;font-weight:800;margin-top:8px;line-height:1.4;word-break:keep-all;letter-spacing:-.2px}
  .ebody{font-size:14px;line-height:1.75;color:#3d365a;margin-top:6px;white-space:pre-wrap;word-break:keep-all}
  .elink{display:inline-block;margin-top:8px;font-family:var(--pixel);font-size:12px;background:#fff6cf;padding:6px 10px;border-radius:8px}
  .edel{margin-left:auto;font-family:var(--pixel);font-size:11px;border:none;background:#fdeaea;color:#c0392b;padding:4px 8px;border-radius:6px;cursor:pointer}
  .empty2{text-align:center;font-family:var(--pixel);font-size:12px;color:var(--ink-soft);padding:30px 0}
  /* 관리자 */
  .adminbar{display:none;margin-top:16px;background:#1b1630;color:#e9e4ff;border-radius:14px;padding:12px 14px;align-items:center;gap:10px;font-family:var(--pixel);font-size:12px}
  .adminbar.on{display:flex}
  .adminbar .grow{flex:1}
  .abtn{font-family:var(--pixel);font-size:12px;border:none;cursor:pointer;padding:9px 12px;border-radius:9px}
  .abtn.y{background:var(--yellow);color:var(--ink);box-shadow:inset 0 -3px 0 var(--shell-dark)}
  .abtn.g{background:#2d2650;color:#e9e4ff}
  .form label{display:block;font-family:var(--pixel);font-size:11.5px;color:var(--ink-soft);margin:10px 0 5px}
  .form input,.form select,.form textarea{width:100%;font:inherit;font-size:14px;padding:10px 11px;border-radius:10px;border:1.5px solid #e2dcee;background:#fbf9ff;color:var(--ink)}
  .form textarea{min-height:120px;resize:vertical;line-height:1.6}
  .form .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .form .hint{font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-top:6px;word-break:keep-all}
  .form .chk{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:13px;color:var(--ink);margin-top:10px}
  .form .chk input{width:auto}
  .tagpick{display:grid;grid-template-columns:1fr 1fr;gap:6px}
  .tagpick label{margin:0;display:flex;align-items:center;gap:6px;padding:8px;border-radius:9px;border:1.5px solid #e2dcee;cursor:pointer;font-family:var(--pixel);font-size:11.5px;color:var(--ink)}
  .tagpick input{width:auto;accent-color:#e2ad12}
  .tagpick label:has(input:checked){border-color:var(--shell-dark);background:#fff6cf}
  .err{color:#c0392b;font-size:12.5px;margin-top:8px;min-height:18px;word-break:keep-all}
  .mbtns{display:flex;gap:8px;margin-top:14px}
  .mbtns button{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back ui-link" id="back" href="/">◀ 오락실로</a>
    <div class="snd" id="snd"></div>
  </div>

  <section class="lhero">
    <div class="hello">&gt; LOADING DEV LOG…<span class="cur">_</span></div>
    <h1>DEV LOG</h1>
    <p>루미 오락실을 만드는 사람의 기록. 비하인드, 아이디어, 삽질, 업데이트까지.</p>
    <div class="legend" id="legend"></div>
  </section>

  <div class="adminbar" id="adminbar">
    <span class="grow">🔑 관리자 모드</span>
    <button class="abtn y" id="btnWrite" type="button">＋ 새 로그</button>
    <button class="abtn g" id="btnLogout" type="button">나가기</button>
  </div>

  <nav class="tabs" id="tabs" aria-label="태그"></nav>
  <div class="timeline" id="list"><div class="empty2">불러오는 중…</div></div>

  <footer>
    © 루미 오락실 · lumimori38<br>
    <button type="button" id="btnAdmin">관리자</button>
  </footer>
</div>

<script src="/arcade.js"></script>
<script>
const A=window.Arcade, $=id=>document.getElementById(id);
A.mountSound($('snd'));
A.navigateWithSound($('back'),'move',230);
let data={entries:[]}, filter='ALL', admin=!!A.admin.getToken();

$('legend').innerHTML=Object.entries(A.TAGS).map(([k,t])=>`<span><span class="ltag" style="--t:${t.color}">${A.pixIcon(t.icon,'#fff')}${k}</span>${t.ko}</span>`).join('');

function renderTabs(){
  const c=k=>k==='ALL'?data.entries.length:data.entries.filter(e=>e.tag===k).length;
  $('tabs').innerHTML=['ALL',...Object.keys(A.TAGS)].map(k=>`<button class="tab${k===filter?' on':''}" type="button" data-k="${k}">${k==='ALL'?'전체':k}<span class="n">${c(k)}</span></button>`).join('');
}
function render(){
  renderTabs();
  $('adminbar').classList.toggle('on', admin);
  const list=data.entries.filter(e=>filter==='ALL'||e.tag===filter);
  if(!list.length){ $('list').innerHTML='<div class="empty2">아직 기록이 없어요</div>'; return; }
  let html='', lastM='';
  list.forEach(e=>{
    const t=A.TAGS[e.tag]||A.TAGS.UPDATE, m=String(e.date).slice(0,7).replace('-','.');
    if(m!==lastM){ html+=`<div class="month">${m}</div>`; lastM=m; }
    const link=e.link?A.safeUrl(e.link):'';
    html+=`<article class="entry" id="${A.esc(e.id)}" style="--t:${t.color}">
      <div class="ehead"><span class="ltag" style="--t:${t.color}">${A.pixIcon(t.icon,'#fff')}${A.esc(e.tag)}</span><span class="ldate">${A.fmtDate(e.date)}</span>
        ${admin?`<button class="edel" type="button" data-id="${A.esc(e.id)}">삭제</button>`:''}</div>
      <h2 class="etitle">${A.esc(e.title)}</h2>
      ${e.body?`<p class="ebody">${A.esc(e.body)}</p>`:''}
      ${link?`<a class="elink ui-link" href="${A.esc(link)}" target="_blank" rel="noopener noreferrer">관련 링크 ▶</a>`:''}
    </article>`;
  });
  $('list').innerHTML=html;
  const h=decodeURIComponent(location.hash.slice(1));
  if(h){ const el=document.getElementById(h); if(el){ el.classList.add('hl'); setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),150); } }
}
$('tabs').addEventListener('click',e=>{ const t=e.target.closest('.tab'); if(!t) return; filter=t.dataset.k; render(); });
A.loadLogs().then(d=>{ data=d; render(); });

/* ---------- 관리자 ---------- */
async function loginModal(){
  const v=await A.admin.loadVault();
  if(!v){ setupModal(true); return; }
  const m=A.showModal(`
    <div class="mh">🔑 관리자 로그인</div>
    <div class="form">
      <label for="pw">관리자 비밀번호</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="비밀번호">
      <label class="chk"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지 (공용 기기에선 끄세요)</label>
      <div class="err" id="err"></div>
      <div class="mbtns"><button class="abtn g" type="button" data-close>취소</button><button class="abtn y" type="button" id="doLogin">로그인</button></div>
      <p class="hint" style="margin-top:12px">비밀번호를 잊었거나 바꾸고 싶다면 <a href="#" id="toSetup" style="text-decoration:underline">토큰으로 재설정</a></p>
    </div>`);
  const go=async()=>{
    const pw=m.querySelector('#pw').value, err=m.querySelector('#err');
    if(!pw){ err.textContent='비밀번호를 입력해 주세요'; return; }
    err.textContent='확인 중… (몇 초 걸려요)';
    try{ await A.admin.loginWithPassword(pw, m.querySelector('#remember').checked); admin=true; m.classList.remove('show'); A.play('ok'); A.toast('관리자 모드 ON'); render(); }
    catch(e){ err.textContent = e.message==='badpw' ? '비밀번호가 틀렸어요' : e.message==='owner' ? 'lumimori38 계정의 토큰이 아니에요' : '로그인 실패: 저장된 토큰이 만료됐을 수 있어요. 토큰으로 재설정해 주세요'; }
  };
  m.querySelector('#doLogin').onclick=go;
  m.querySelector('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') go(); });
  m.querySelector('#toSetup').onclick=e=>{ e.preventDefault(); setupModal(false); };
  setTimeout(()=>m.querySelector('#pw').focus(),50);
}
function setupModal(first){
  const m=A.showModal(`
    <div class="mh">🔑 ${first?'관리자 처음 설정 (한 번만)':'비밀번호 재설정'}</div>
    <div class="form">
      <p class="hint" style="margin-top:0">GitHub 토큰을 한 번 넣고 비밀번호를 정하면, 다음부터는 <b>어느 기기에서든 비밀번호만</b> 입력하면 돼요. 토큰은 비밀번호로 암호화돼 저장돼요.</p>
      <label for="tk">GitHub 토큰</label>
      <input id="tk" type="password" autocomplete="off" placeholder="github_pat_...">
      <div class="row2"><div><label for="p1">새 비밀번호</label><input id="p1" type="password" autocomplete="new-password" placeholder="10자 이상"></div>
      <div><label for="p2">비밀번호 확인</label><input id="p2" type="password" autocomplete="new-password"></div></div>
      <label class="chk"><input type="checkbox" id="remember"> 이 기기에서 로그인 유지</label>
      <div class="err" id="err"></div>
      <div class="mbtns"><button class="abtn g" type="button" data-close>취소</button><button class="abtn y" type="button" id="doSetup">설정하고 로그인</button></div>
    </div>`);
  m.querySelector('#doSetup').onclick=async()=>{
    const t=m.querySelector('#tk').value.trim(), p1=m.querySelector('#p1').value, p2=m.querySelector('#p2').value, err=m.querySelector('#err');
    if(!t){ err.textContent='GitHub 토큰을 입력해 주세요'; return; }
    if(p1.length<10){ err.textContent='비밀번호는 10자 이상으로 정해 주세요'; return; }
    if(p1!==p2){ err.textContent='비밀번호 확인이 달라요'; return; }
    err.textContent='설정 중…';
    try{ await A.admin.setupPassword(t, p1, m.querySelector('#remember').checked); admin=true; m.classList.remove('show'); A.play('ok'); A.toast('설정 완료! 다음부터는 비밀번호로 로그인'); render(); }
    catch(e){ err.textContent = e.message==='owner' ? 'lumimori38 계정의 토큰이 아니에요' : (e.status===403||e.status===404) ? '토큰 권한 오류: Contents 쓰기 권한을 확인해 주세요' : '설정 실패: 토큰이 맞는지 확인해 주세요'; }
  };
  setTimeout(()=>m.querySelector('#tk').focus(),50);
}
function today(){ const d=new Date(Date.now()+9*3600e3); return d.toISOString().slice(0,10); }
function writeModal(){
  const m=A.showModal(`
    <div class="mh">＋ 새 로그 쓰기</div>
    <div class="form">
      <label>태그</label>
      <div class="tagpick">${Object.entries(A.TAGS).map(([k,t],i)=>`<label><input type="radio" name="tag" value="${k}" ${i===0?'checked':''}>${A.pixIcon(t.icon,t.color)} ${k}</label>`).join('')}</div>
      <div class="row2"><div><label for="fd">날짜</label><input id="fd" type="date" value="${today()}"></div><div><label for="fl">관련 링크 (선택)</label><input id="fl" type="url" placeholder="https://"></div></div>
      <label for="ft">한 줄 제목 (홈에 노출)</label>
      <input id="ft" type="text" maxlength="60" placeholder="예: 커닝 지능 테스트는 왜 만들었을까?">
      <label for="fb">본문 (선택)</label>
      <textarea id="fb" placeholder="자세한 이야기는 여기에. 줄바꿈 그대로 보여요."></textarea>
      <div class="err" id="err"></div>
      <div class="mbtns"><button class="abtn g" type="button" data-close>취소</button><button class="abtn y" type="button" id="doSave">올리기</button></div>
    </div>`);
  m.querySelector('#doSave').onclick=async()=>{
    const err=m.querySelector('#err'), btn=m.querySelector('#doSave');
    const tag=m.querySelector('input[name=tag]:checked').value, date=m.querySelector('#fd').value||today();
    const title=m.querySelector('#ft').value.trim(), body=m.querySelector('#fb').value.trim(), link=m.querySelector('#fl').value.trim();
    if(!title){ err.textContent='한 줄 제목을 입력해 주세요'; return; }
    if(link && !A.safeUrl(link)){ err.textContent='링크는 https:// 로 시작해야 해요'; return; }
    btn.disabled=true; err.textContent='저장 중…';
    const entry={ id:date.replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,7), tag, date, title, body, link };
    try{
      data=await A.admin.writeRemote(d=>{ d.entries.push(entry); }, `devlog: ${tag} ${title}`);
      data.entries=data.entries.slice();
      m.classList.remove('show'); A.play('ok'); A.toast('로그 등록 완료! 1~2분 뒤 모두에게 보여요'); render();
    }catch(e){ btn.disabled=false; err.textContent = e.status===401||e.status===403 ? '권한 오류: 토큰에 Contents 쓰기 권한이 있는지 확인해 주세요' : '저장 실패 ('+(e.status||e.message)+'). 잠시 뒤 다시 시도해 주세요'; }
  };
}
$('btnAdmin').onclick=()=> admin ? A.toast('이미 관리자 모드예요') : loginModal();
$('btnWrite').onclick=writeModal;
$('btnLogout').onclick=()=>{ A.admin.clearToken(); admin=false; render(); A.toast('관리자 모드 OFF'); };
$('list').addEventListener('click', async e=>{
  const b=e.target.closest('.edel'); if(!b) return;
  const id=b.dataset.id, entry=data.entries.find(x=>x.id===id);
  const m=A.showModal(`<div class="mh">로그 삭제</div><p style="font-size:14px;line-height:1.6;word-break:keep-all">“${A.esc(entry?entry.title:'')}”을(를) 삭제할까요? 되돌릴 수 없어요.</p>
    <div class="err" id="err"></div><div class="mbtns"><button class="abtn g" type="button" data-close>취소</button><button class="abtn y" type="button" id="doDel">삭제</button></div>`);
  m.querySelector('#doDel').onclick=async()=>{
    m.querySelector('#err').textContent='삭제 중…';
    try{ data=await A.admin.writeRemote(d=>{ d.entries=d.entries.filter(x=>x.id!==id); }, 'devlog: delete '+id); m.classList.remove('show'); A.toast('삭제했어요'); render(); }
    catch(err){ m.querySelector('#err').textContent='삭제 실패 ('+(err.status||err.message)+')'; }
  };
});
</script>
</body>
</html>
